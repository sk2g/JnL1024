<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>J &amp; L · 1024</title>
    <meta name="description" content="J 與 L 的婚禮網站。查看 Google Drive 婚照，並用姓名或稱呼找到自己的桌次。" />
    <meta name="theme-color" content="#f6efe8" />
    <meta property="og:title" content="J &amp; L · 1024" />
    <meta property="og:description" content="查看婚照與座位表。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23f6efe8' width='64' height='64' rx='14'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Georgia' font-size='22' fill='%23a6786c'%3EJ%26L%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body id="top">
    <header class="nav">
      <a class="logo" href="#top">J &amp; L</a>
      <nav aria-label="頁面">
        <a href="#gallery">婚照</a>
        <a href="#seating">座位表</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">Our Wedding</p>
        <h1><span id="name-a">J</span> <i>&amp;</i> <span id="name-b">L</span></h1>
        <p class="hero-date" id="hero-date">2026.10.24</p>
        <p class="hero-sub" id="hero-sub">星期六</p>
        <p class="hero-note">歡迎來到我們的婚禮</p>
      </section>

      <section id="gallery" class="section">
        <header class="section-head">
          <p class="eyebrow">Album</p>
          <h2>婚照</h2>
          <p class="lead">照片放在 Google Drive，可以在這裡直接看。</p>
        </header>
        <div id="gallery-root"></div>
      </section>

      <section id="seating" class="section">
        <header class="section-head">
          <p class="eyebrow">Seating</p>
          <h2>座位表</h2>
          <p class="lead">輸入自己的姓名或稱呼，找出坐在哪一桌。</p>
          <p class="sample-note" id="sample-note" hidden>這份座位表仍是範例。換成正式賓客後，請把 wedding-data.js 的 sampleSeating 改成 false。</p>
        </header>

        <form id="seat-form" class="search-form" role="search">
          <label class="sr-only" for="seat-query">姓名或稱呼</label>
          <input id="seat-query" name="q" type="search" enterkeyhint="search" autocomplete="name" placeholder="姓名、暱稱或稱呼" />
          <button class="text-button" id="search-clear" type="button" hidden>清除</button>
          <button class="primary" type="submit">尋找座位</button>
        </form>
        <div id="search-result" class="search-result" aria-live="polite"></div>

        <div class="hall" id="hall" aria-label="桌次配置"></div>
        <div class="table-list" id="table-list"></div>
      </section>
    </main>

    <footer class="footer">
      <p>J &amp; L · 1024</p>
    </footer>

    <dialog id="lightbox" aria-label="放大照片">
      <form method="dialog">
        <button class="icon-button" value="close" aria-label="關閉照片">關閉</button>
      </form>
      <img id="lightbox-img" alt="" />
      <p id="lightbox-caption"></p>
    </dialog>

    <noscript>
      <p class="noscript">查看婚照與查詢座位需要開啟 JavaScript。</p>
    </noscript>
    <script src="wedding-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
